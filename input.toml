[input]
middle_click_paste = false
client_window_drag = false

[input.keyboard]
numlock_toggle = true
options = "caps:ctrl_modifier"
repeat_rate = 25
repeat_delay = 600
track_layout = "global"

[input.focus]
follows_mouse = true
hover_raises = true
follows_mouse_max_scroll = 0.5

[input.mouse]
sensitivity = 1.0
accel_profile = "flat"
scroll_wheel_step = 60
natural_scroll = false
left_handed = false

[input.touchpad]
enabled = true
tap = true
tap_and_drag = true
drag_lock = "off"
natural_scroll = true
left_handed = false
accel_profile = "adaptive"
sensitivity = 1.0
scroll_factor = 1.0
disable_while_typing = true
scroll_method = "two_finger"
click_method = "button_areas"
tap_button_map = "left_right_middle"
